<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; width: 320px; color: #0b1215; }
      h1 { font-size: 16px; margin: 0 0 4px; }
      p { margin: 0 0 12px; color: #5b6b70; font-size: 13px; }
      label { display: block; font-weight: 600; font-size: 12px; margin: 10px 0 4px; }
      select, input { width: 100%; padding: 8px; border: 1.5px solid rgba(11,18,21,.15); border-radius: 8px; font: inherit; }
      button { margin-top: 12px; width: 100%; padding: 9px; border: 0; border-radius: 999px; background: #0f5563; color: #fff; font-weight: 600; cursor: pointer; }
      .muted { font-size: 12px; color: #5b6b70; margin-top: 10px; }
      .err { color: #c2362b; }
      details { margin-top: 12px; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Save to PitchGen</h1>
    <p>Pick the pitch to save frames into. Then right-click any image on ShotDeck, Flim or Film-Grab.</p>
    <label for="slug">Pitch</label>
    <select id="slug"><option value="">Loading…</option></select>
    <button id="save">Use this pitch</button>
    <div id="status" class="muted"></div>
    <details>
      <summary>Settings</summary>
      <label for="base">PitchGen address</label>
      <input id="base" placeholder="https://cwcasting.com/pitchgen" />
    </details>
    <script src="popup.js"></script>
  </body>
</html>
